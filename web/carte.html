<title>Sites web publics V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #EDF0F5;
    --panel: #FFFFFF;
    --panel-2: #F5F7FA;
    --ink: #162033;
    --muted: #5A6579;
    --line: #D6DCE6;
    --accent: #1F3FB5;
    --accent-soft: #E3E8FA;
    --ok: #17703D;
    --warn: #8A5300;
    --bad: #C2362F;
    --neutral: #6B7483;
    --edge: rgba(22,32,51,0.13);
    --label: #162033;
    --shadow: 0 1px 2px rgba(22, 32, 51, .06), 0 8px 24px rgba(22, 32, 51, .08);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0C1119;
      --panel: #141B26;
      --panel-2: #1A2331;
      --ink: #E4E9F1;
      --muted: #97A2B5;
      --line: #273142;
      --accent: #8EA6FF;
      --accent-soft: #1E2A4A;
      --ok: #4CC47E;
      --warn: #E6A43A;
      --bad: #F0706A;
      --neutral: #9099A8;
      --edge: rgba(228,233,241,0.10);
      --label: #E4E9F1;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0C1119;
    --panel: #141B26;
    --panel-2: #1A2331;
    --ink: #E4E9F1;
    --muted: #97A2B5;
    --line: #273142;
    --accent: #8EA6FF;
    --accent-soft: #1E2A4A;
    --ok: #4CC47E;
    --warn: #E6A43A;
    --bad: #F0706A;
    --neutral: #9099A8;
    --edge: rgba(228,233,241,0.10);
    --label: #E4E9F1;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }

  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .skip {
    position: fixed; z-index: 10; top: 8px; left: 8px;
    padding: 8px 12px; border-radius: 6px;
    background: var(--panel); color: var(--ink); border: 2px solid var(--accent);
    transform: translateY(-200%);
  }
  .skip:focus { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.45 var(--sans);
    overflow: hidden;
  }
  #graph { position: fixed; inset: 0; }
  #graph canvas { outline: none; }

  .panel {
    position: fixed;
    z-index: 2;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  /* --- Panneau principal : titre, recherche, légende --- */
  #side {
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    width: 320px;
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font: 500 12px/1.2 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 6px 0 4px;
    font-size: 20px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); font-size: 12.5px; }
  .figures {
    display: flex;
    gap: 14px;
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .figures div { display: flex; flex-direction: column; }
  .figures b { font-size: 16px; font-weight: 600; }
  .figures span { font-size: 12px; color: var(--muted); }

  .search { position: relative; padding: 12px 16px; }
  .search input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--ink);
    font: inherit;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #results {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  #results button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  #results button:hover { background: var(--accent-soft); }
  #results button:focus-visible { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  #results .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .legend { padding: 10px 16px 14px; overflow-y: auto; }
  .legend-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font: 500 12px/1.2 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend-title button {
    border: 0; background: none; padding: 4px 0; cursor: pointer; text-decoration: underline;
    font: inherit; letter-spacing: inherit; color: var(--accent);
  }
  .legend label {
    display: grid;
    grid-template-columns: 16px 10px 1fr auto;
    align-items: center;
    gap: 8px;
    min-height: 28px;
    padding: 2px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .legend input { margin: 0; accent-color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    cursor: pointer;
  }
  .toggle input { margin: 0; accent-color: var(--accent); }
  .ring {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--accent); box-sizing: border-box;
  }

  /* --- Fiche d'un élément --- */
  #detail {
    z-index: 4;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 16px;
    width: 360px;
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .detail-head {
    position: sticky;
    top: 0;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 14px 14px 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .detail-head > div { flex: 1; min-width: 0; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 500 12px/1.2 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #d-title:focus { outline: none; }
  #d-title {
    margin: 6px 0 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  #d-title a { color: var(--accent); text-decoration: none; }
  #d-title a:hover { text-decoration: underline; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge {
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .badge.new { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .badge.ok { color: var(--ok); border-color: currentColor; }
  .badge.warn { color: var(--warn); border-color: currentColor; }
  .badge.bad { color: var(--bad); border-color: currentColor; }
  .close {
    flex: none;
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .close:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--accent); }
  dl {
    display: grid;
    grid-template-columns: minmax(96px, 38%) 1fr;
    gap: 6px 12px;
    margin: 0;
    padding: 12px 16px;
    font-size: 13px;
  }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd.mono { font-family: var(--mono); font-size: 12px; }
  dd a { color: var(--accent); }
  .neighbours { padding: 4px 16px 16px; }
  .neighbours h3 {
    margin: 10px 0 4px;
    font: 500 12px/1.2 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .neighbours ul { list-style: none; margin: 0; padding: 0; }
  .neighbours button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 32px;
    padding: 4px 6px;
    margin-left: -6px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .neighbours button:hover { background: var(--accent-soft); }
  .neighbours button:focus-visible { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  .neighbours .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- Noms des pôles sur la carte --- */
  #poles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #poles span {
    position: absolute;
    transform: translate(-50%, -100%);
    max-width: 220px;
    padding: 2px 6px;
    border-radius: 4px;
    font: 600 12px/1.25 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    text-align: center;
    color: var(--muted);
    background: color-mix(in srgb, var(--ground) 78%, transparent);
    white-space: normal;
    text-wrap: balance;
  }
  #poles.dim span { opacity: .25; }

  .goto { padding: 0 16px 12px; border-bottom: 1px solid var(--line); }
  .goto select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
  }
  .goto select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* --- Bascule carte / liste --- */
  .views { display: flex; gap: 6px; margin-top: 12px; }
  .views button {
    flex: 1;
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--ink);
    font: 500 13px var(--sans);
    cursor: pointer;
  }
  .views button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }

  /* --- Vue liste par pôle --- */
  #list {
    top: calc(16px + env(safe-area-inset-top, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 352px;
    right: 16px;
    overflow-y: auto;
    padding: 0 20px 20px;
  }
  .list-head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .list-head h2 { margin: 0; font-size: 18px; }
  .list-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .list-back {
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--ink);
    font: 500 13px var(--sans);
    cursor: pointer;
  }
  #list details { border-bottom: 1px solid var(--line); }
  #list summary {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
  }
  #list summary .count { font-weight: 400; }
  #list summary { list-style: none; }
  #list summary::-webkit-details-marker { display: none; }
  #list summary > span:first-child::before {
    content: "▸";
    display: inline-block;
    width: 1.2em;
    color: var(--muted);
  }
  #list details[open] > summary > span:first-child::before { content: "▾"; }
  #list h3 {
    margin: 8px 0 4px;
    font: 500 12px/1.2 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #list ul {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
    columns: 2 300px;
    column-gap: 24px;
  }
  #list li { break-inside: avoid; }
  #list li button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 30px;
    padding: 3px 6px;
    margin-left: -6px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  #list li button:hover { background: var(--accent-soft); }
  #list li button:focus-visible { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
  #list .txt { overflow-wrap: anywhere; }
  #list .new { margin-left: auto; font-size: 11.5px; color: var(--accent); white-space: nowrap; }
  body.list-mode .zoom, body.list-mode #poles { display: none; }

  .via { color: var(--muted); font-size: 12px; }
  .subs { margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
  .subs summary { padding: 8px 0; cursor: pointer; font-weight: 600; font-size: 13px; }
  .subs ul { list-style: none; margin: 0 0 8px; padding: 0; max-height: 320px; overflow-y: auto; }
  .subs li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; overflow-wrap: anywhere; }
  .subs li.hit { background: var(--accent-soft); border-radius: 4px; padding-inline: 4px; }
  .subs li button, .bubble-of button {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 28px; padding: 2px 4px; border: 0; border-radius: 4px;
    background: none; color: var(--accent); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    text-decoration: underline;
  }
  .subs li button:hover, .bubble-of button:hover { background: var(--accent-soft); }
  .bubble-of { margin: 8px 0; font-size: 13px; color: var(--muted); }

  /* --- Zoom --- */
  .zoom {
    position: fixed;
    z-index: 2;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .zoom button {
    width: 44px; height: 44px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
  }
  .zoom button:last-child { border-bottom: 0; font-size: 13px; }
  .zoom button:hover { background: var(--panel-2); }

  #status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }

  @media (max-width: 760px) {
    #list { left: 16px; z-index: 3; padding: 0 16px 16px; }
    #side { left: 16px; right: 16px; width: auto; max-height: 48%; }
    .figures { display: none; }
    .legend { max-height: 30vh; }
    #detail {
      top: auto;
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: auto;
      max-height: 55%;
      z-index: 4;
    }
    .zoom { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (max-width: 760px) and (max-height: 700px) {
    .legend { max-height: 18vh; }
  }
</style>

<a class="skip" href="#q">Aller à la recherche</a>
<div id="graph" role="img" aria-label="Carte en réseau des sites web publics et de leurs administrations. Utilisez la recherche, le menu des ministères et la fiche de chaque élément pour la parcourir au clavier."></div>
<p id="announce" class="sr-only" aria-live="polite"></p>
<div id="poles" aria-hidden="true"></div>
<p id="status">Chargement de la carte…</p>

<aside id="side" class="panel" aria-label="Recherche et légende">
  <div class="head">
    <div class="eyebrow">Cartographie · V2</div>
    <h1>Sites web publics de l'État</h1>
    <p class="sub" id="sub">Sites en gouv.fr, opérateurs et administrations de rattachement.</p>
    <div class="figures" id="figures"></div>
    <div class="views" role="group" aria-label="Affichage">
      <button type="button" id="v-map" aria-pressed="true">Carte</button>
      <button type="button" id="v-list" aria-pressed="false">Liste par pôle</button>
    </div>
  </div>
  <div class="search">
    <label for="q" class="sr-only">Rechercher un site ou une administration</label>
    <input id="q" type="search" placeholder="Rechercher un site ou une administration" autocomplete="off" aria-controls="results" aria-describedby="q-count">
    <p id="q-count" class="sr-only" aria-live="polite"></p>
    <ul id="results" aria-label="Résultats de la recherche"></ul>
  </div>
  <div class="goto">
    <label for="pole" class="sr-only">Aller à un ministère</label>
    <select id="pole">
      <option value="">Aller à un ministère…</option>
    </select>
  </div>
  <div class="legend">
    <div class="legend-title"><span>Afficher</span><button type="button" id="all">Tout afficher</button></div>
    <div id="cats"></div>
    <label class="toggle" for="only-new">
      <input type="checkbox" id="only-new">
      <span class="ring" aria-hidden="true"></span>
      <span>Mettre en avant les ajouts de la V2</span>
    </label>
  </div>
</aside>

<aside id="detail" class="panel" aria-labelledby="d-title" hidden>
  <div class="detail-head">
    <div>
      <span class="chip" id="d-cat"></span>
      <h2 id="d-title" tabindex="-1"></h2>
      <div class="badges" id="d-badges"></div>
    </div>
    <button type="button" class="close" id="d-close" aria-label="Fermer la fiche" title="Fermer la fiche"><span aria-hidden="true">×</span></button>
  </div>
  <dl id="d-attrs"></dl>
  <div class="neighbours" id="d-links"></div>
</aside>

<section id="list" class="panel" aria-labelledby="list-title" hidden>
  <div class="list-head">
    <div>
      <h2 id="list-title" tabindex="-1">Liste par pôle</h2>
      <p id="list-count"></p>
    </div>
    <button type="button" class="list-back" id="list-back">Revenir à la carte</button>
  </div>
  <div id="list-body"></div>
</section>

<div class="zoom panel" role="group" aria-label="Zoom">
  <button type="button" id="z-in" aria-label="Zoomer" title="Zoomer"><span aria-hidden="true">+</span></button>
  <button type="button" id="z-out" aria-label="Dézoomer" title="Dézoomer"><span aria-hidden="true">−</span></button>
  <button type="button" id="z-reset" aria-label="Recentrer la carte" title="Recentrer la carte"><span aria-hidden="true">⟲</span></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@3.0.3/dist/sigma.min.js"></script>
<script>
(async function () {
  const status = document.getElementById('status');
  let data;
  try {
    const res = await fetch('graph.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    status.textContent = 'Impossible de charger les données de la carte (graph.json) : ' + e.message;
    return;
  }

  document.documentElement.lang = 'fr';
  const SigmaCtor = window.Sigma.Sigma || window.Sigma.default || window.Sigma;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const dur = ms => reduceMotion.matches ? 0 : ms;
  const cats = new Map(data.categories.map(c => [c.id, c]));
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const isDark = () => css('--ground').toLowerCase() === '#0c1119';
  // Le gris des sites archivés est trop sombre sur fond sombre.
  const catColor = id => (id === 'archive' && isDark()) ? '#8A919C' : cats.get(id).color;

  // Libellé court sur la carte, libellé complet dans la fiche.
  const short = key => key.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '');

  const graph = new graphology.UndirectedGraph();
  // Bulles : chaque membre (index 8) est rangé autour du site racine de sa bulle.
  const membersOf = new Map();
  const childrenOf = new Map();
  for (const [key, x, y, size, categorie, nouveau, attrs, pole, bulle, direct] of data.nodes) {
    if (direct >= 0) {
      const pk = data.nodes[direct][0];
      if (!childrenOf.has(pk)) childrenOf.set(pk, []);
      childrenOf.get(pk).push(key);
    }
    const n = Number(attrs.sousDomaines || 0);
    const root = bulle >= 0 ? data.nodes[bulle][0] : null;
    graph.addNode(key, { x, y, size, categorie, nouveau: !!nouveau, attrs, pole, bulle: root,
      parentDirect: direct >= 0 ? data.nodes[direct][0] : null, color: cats.get(categorie).color,
      label: n ? `${short(key)} +${n.toLocaleString('fr-FR')}` : short(key) });
    if (root) {
      if (!membersOf.has(root)) membersOf.set(root, []);
      membersOf.get(root).push(key);
    }
  }
  // « kind » et non « type » : sigma réserve l'attribut « type » au programme de rendu.
  for (const [s, t, kind] of data.edges) {
    const a = data.nodes[s][0], b = data.nodes[t][0];
    if (!graph.hasEdge(a, b)) graph.addEdge(a, b, { kind });
  }

  // --- En-tête ---
  const m = data.meta;
  const fmt = n => n.toLocaleString('fr-FR');
  const dateFr = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('sub').textContent = `Mise à jour du ${dateFr(m.date)} · vérifications HTTP du ${dateFr(m.verifie)}.`;
  document.getElementById('figures').innerHTML =
    `<div><b>${fmt(m.elements)}</b><span>éléments</span></div>` +
    `<div><b>${fmt(m.connexions)}</b><span>liens</span></div>` +
    `<div><b>${fmt(m.nouveaux)}</b><span>ajouts V2</span></div>`;
  if (m.regroupes) document.getElementById('sub').textContent += ` ${fmt(m.regroupes)} sous-domaines forment ${fmt(m.bulles)} bulles autour de leur site (« +N ») : zoomez dans une bulle ou ouvrez la fiche du site.`;

  // --- État de l'interface ---
  // Par défaut, les sites off ou archivés sont masqués.
  const STORE = 'carte-v2-filtres-2';
  const state = { hidden: new Set(['archive']), onlyNew: false, hovered: null, selected: null, neighbours: new Set() };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) {
      state.hidden = new Set((saved.hidden || []).filter(c => cats.has(c)));
      state.onlyNew = !!saved.onlyNew;
    }
  } catch (e) {}
  const save = () => {
    try { localStorage.setItem(STORE, JSON.stringify({ hidden: [...state.hidden], onlyNew: state.onlyNew })); } catch (e) {}
  };
  // Toute modification des filtres redessine la carte et, si elle est ouverte, la liste.
  const filtersChanged = () => { save(); renderer.refresh(); if (!listEl.hidden) renderList(); };

  // --- Légende ---
  const counts = {};
  graph.forEachNode((n, a) => { counts[a.categorie] = (counts[a.categorie] || 0) + 1; });
  const catsEl = document.getElementById('cats');
  for (const c of data.categories) {
    if (!counts[c.id]) continue;
    const label = document.createElement('label');
    label.htmlFor = 'cat-' + c.id;
    label.innerHTML = `<input type="checkbox" id="cat-${c.id}" ${state.hidden.has(c.id) ? '' : 'checked'}>` +
      `<span class="dot" style="background:${catColor(c.id)}"></span><span>${c.label}</span><span class="count">${fmt(counts[c.id])}</span>`;
    label.querySelector('input').addEventListener('change', e => {
      e.target.checked ? state.hidden.delete(c.id) : state.hidden.add(c.id);
      filtersChanged();
    });
    catsEl.appendChild(label);
  }
  document.getElementById('all').addEventListener('click', () => {
    state.hidden.clear();
    catsEl.querySelectorAll('input').forEach(i => { i.checked = true; });
    filtersChanged();
  });
  const onlyNew = document.getElementById('only-new');
  onlyNew.checked = state.onlyNew;
  onlyNew.addEventListener('change', () => { state.onlyNew = onlyNew.checked; filtersChanged(); });

  // --- Étiquettes : couleurs du thème, fond contrasté ---
  const theme = {};
  const readTheme = () => ['ground', 'label', 'panel', 'ink', 'accent'].forEach(k => { theme[k] = css('--' + k); });
  readTheme();
  function drawLabel(ctx, d, settings) {
    if (!d.label) return;
    ctx.font = `${settings.labelWeight} ${settings.labelSize}px ${settings.labelFont}`;
    const x = d.x + d.size + 4, y = d.y + settings.labelSize / 3;
    // Liseré couleur du fond pour détacher le texte des nœuds et des liens.
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = theme.ground;
    ctx.strokeText(d.label, x, y);
    ctx.fillStyle = theme.label;
    ctx.fillText(d.label, x, y);
  }
  function drawHover(ctx, d, settings) {
    const size = settings.labelSize;
    ctx.font = `600 ${size}px ${settings.labelFont}`;
    const pad = 5, h = size + pad * 2;
    const w = d.label ? ctx.measureText(d.label).width + d.size + pad * 3 : 0;
    ctx.save();
    ctx.fillStyle = theme.panel;
    ctx.strokeStyle = theme.accent;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(0,0,0,.25)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size + pad, 0, Math.PI * 2);
    if (w) ctx.roundRect ? ctx.roundRect(d.x, d.y - h / 2, w + d.size, h, 4) : ctx.rect(d.x, d.y - h / 2, w + d.size, h);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();
    // Nœud redessiné par-dessus le cadre.
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
    ctx.fill();
    if (d.label) {
      ctx.fillStyle = theme.ink;
      ctx.fillText(d.label, d.x + d.size + pad + 2, d.y + size / 3);
    }
  }

  // --- Rendu ---
  const faded = () => isDark() ? '#2A3342' : '#D3D9E2';
  const focus = () => state.hovered || state.selected;
  const renderer = new SigmaCtor(graph, document.getElementById('graph'), {
    labelFont: '"IBM Plex Sans", system-ui, sans-serif',
    labelSize: 12,
    labelWeight: '500',
    labelColor: { color: css('--label') },
    labelRenderedSizeThreshold: 9,
    defaultEdgeColor: css('--edge'),
    zIndex: true,
    allowInvalidContainer: true,
    defaultDrawNodeLabel: drawLabel,
    defaultDrawNodeHover: drawHover,
    minCameraRatio: 0.03,
    maxCameraRatio: 3,
    nodeReducer(node, a) {
      const r = { ...a, color: catColor(a.categorie) };
      if (state.hidden.has(a.categorie)) { r.hidden = true; return r; }
      // Le nom du ministère est déjà affiché comme nom de pôle.
      if (data.poles[a.pole] && data.poles[a.pole].id === node) r.label = '';
      const f = focus();
      if (f) {
        if (node === f) { r.highlighted = true; r.zIndex = 2; r.forceLabel = true; r.label = a.label; }
        // Voisins mis en évidence ; les noms des membres d'une bulle n'apparaissent qu'en zoomant.
        else if (state.neighbours.has(node)) { r.zIndex = 1; r.forceLabel = a.bulle !== f; }
        else { r.color = faded(); r.label = ''; r.zIndex = 0; }
      } else if (state.onlyNew && !a.nouveau) {
        r.color = faded(); r.label = '';
      } else if (state.onlyNew) {
        r.zIndex = 1;
      }
      return r;
    },
    edgeReducer(edge, a) {
      const r = { ...a };
      const [s, t] = graph.extremities(edge);
      if (state.hidden.has(graph.getNodeAttribute(s, 'categorie')) || state.hidden.has(graph.getNodeAttribute(t, 'categorie'))) {
        r.hidden = true; return r;
      }
      const f = focus();
      if (a.kind === 'bulle') {
        const fb = f && (graph.getNodeAttribute(f, 'bulle') || f);
        const eb = graph.getNodeAttribute(t, 'bulle');
        if (!f || fb !== eb) { r.hidden = true; return r; }
        // Chemin de l'élément sélectionné plus marqué que le reste de l'arborescence.
        const onPath = state.neighbours.has(s) && state.neighbours.has(t) || s === f || t === f;
        r.color = onPath ? (isDark() ? 'rgba(142,166,255,.8)' : 'rgba(31,63,181,.65)') : (isDark() ? 'rgba(142,166,255,.22)' : 'rgba(31,63,181,.18)');
        r.size = onPath ? 1.4 : 0.6;
        return r;
      }
      if (f) {
        if (s === f || t === f) { r.color = isDark() ? 'rgba(142,166,255,.7)' : 'rgba(31,63,181,.55)'; r.size = 1.5; }
        else r.hidden = true;
      }
      return r;
    },
  });
  status.hidden = true;

  const setFocusNeighbours = () => {
    const f = focus();
    if (!f) { state.neighbours = new Set(); return; }
    const set = new Set(graph.neighbors(f));
    for (const m of membersOf.get(f) || []) set.add(m);
    for (let p = graph.getNodeAttribute(f, 'parentDirect'), i = 0; p && i < 20; p = graph.getNodeAttribute(p, 'parentDirect'), i++) set.add(p);
    const walk = n => { for (const c of childrenOf.get(n) || []) { set.add(c); walk(c); } };
    walk(f);
    state.neighbours = set;
  };
  renderer.on('enterNode', ({ node }) => { state.hovered = node; setFocusNeighbours(); renderer.refresh({ skipIndexation: true }); });
  renderer.on('leaveNode', () => { state.hovered = null; setFocusNeighbours(); renderer.refresh({ skipIndexation: true }); });
  renderer.on('clickNode', ({ node }) => select(node, { focus: false }));
  renderer.on('clickStage', () => select(null));

  // Suivi du thème (système ou choix explicite).
  const applyTheme = () => {
    readTheme();
    renderer.setSetting('labelColor', { color: css('--label') });
    renderer.setSetting('defaultEdgeColor', css('--edge'));
    catsEl.querySelectorAll('.dot').forEach((d, i) => {
      const id = data.categories.filter(c => counts[c.id])[i].id;
      d.style.background = catColor(id);
    });
    renderer.refresh();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // --- Fiche ---
  const detail = document.getElementById('detail');
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const link = url => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`;
  const FIELDS = [
    ['Site parent', 'Site parent'], ['Organisme', 'Organisme'], ['Tutelle', 'Tutelle'], ['Rattachement déduit de', 'Rattachement déduit de'], ['Bloc-marque', 'Bloc-marque DSFR'], ['Type d\'organisme', 'Type d\'organisme'],
    ['Opérateur de l\'État', 'Opérateur (PLF)'], ['Statut juridique', 'Statut juridique'],
    ['Programme chef de file', 'Programme budgétaire'], ['Intitulé 2019', 'Intitulé 2019'],
    ['Code HTTP', 'Code HTTP', 'mono'], ['URL finale', 'URL finale', 'url'], ['Erreur', 'Erreur', 'mono'],
    ['Type précédent', 'Type en V1'], ['Vérifié le', 'Vérifié le'], ['Ajouté le', 'Ajouté le'],
    ['SIREN', 'SIREN', 'mono'], ['Source', 'Source'], ['URL annuaire', 'Fiche annuaire', 'url'],
  ];
  const statusClass = { 'En ligne': 'ok', 'Redirigé': 'warn', 'Hors ligne': 'bad', 'Indéterminé': '' };

  const announce = document.getElementById('announce');
  let returnFocus = null;
  const statusClassOf = s => ({ 'En ligne': 'ok', 'Redirigé': 'warn', 'Hors ligne': 'bad' }[s] || '');
  function subsHtml(node) {
    const btn = k => `<button type="button" data-node="${esc(k)}">${esc(short(k))}</button>`;
    const root = graph.getNodeAttribute(node, 'bulle');
    const direct = graph.getNodeAttribute(node, 'parentDirect');
    let html = '';
    if (root) {
      html += `<p class="bubble-of">Dans la bulle de ${btn(root)}` + (direct && direct !== root ? `, sous-domaine de ${btn(direct)}` : '') + '</p>';
    }
    const kids = childrenOf.get(node);
    if (!kids) return html;
    const total = root ? null : membersOf.get(node)?.length;
    const open = kids.length <= 30 ? ' open' : '';
    html += `<details class="subs"${open}><summary>Sous-domaines · ${fmt(kids.length)}${total && total > kids.length ? ` (${fmt(total)} dans la bulle)` : ''}</summary><ul>` +
      kids.slice().sort((a, b) => short(a).localeCompare(short(b), 'fr')).map(k => {
        const a = graph.getNodeAttributes(k), st = a.attrs.Statut, code = a.attrs['Code HTTP'];
        const sub = childrenOf.get(k)?.length;
        return `<li><button type="button" data-node="${esc(k)}"><span class="dot" style="background:${catColor(a.categorie)}" aria-hidden="true"></span>${esc(short(k))}</button>` +
          `${sub ? ` <span class="via">+${fmt(sub)}</span>` : ''}` +
          `${st ? ` <span class="badge ${statusClassOf(st)}">${esc(st)}${code && st !== 'En ligne' ? ' ' + esc(code) : ''}</span>` : ''}</li>`;
      }).join('') + '</ul></details>';
    return html;
  }
  function select(node, { focus = true } = {}) {
    if (node && !state.selected && document.activeElement && document.activeElement !== document.body) returnFocus = document.activeElement;
    state.selected = node;
    setFocusNeighbours();
    renderer.refresh({ skipIndexation: true });
    if (!node) {
      const wasOpen = !detail.hidden;
      detail.hidden = true;
      if (wasOpen && returnFocus && document.contains(returnFocus)) returnFocus.focus();
      returnFocus = null;
      return;
    }
    const a = graph.getNodeAttributes(node);
    const cat = cats.get(a.categorie);
    document.getElementById('d-cat').innerHTML = `<span class="dot" style="background:${catColor(a.categorie)}"></span>${esc(cat.label)}`;
    document.getElementById('d-title').innerHTML = /^https?:\/\//.test(node) ? link(node) : esc(node);
    const badges = [];
    if (a.nouveau) badges.push('<span class="badge new">Ajout V2</span>');
    if (a.attrs.Statut) badges.push(`<span class="badge ${statusClass[a.attrs.Statut] ?? ''}">${esc(a.attrs.Statut)}</span>`);
    for (const t of (a.attrs.tags || '').split('|')) {
      if (['À rattacher', 'À revérifier', 'Tutelle à préciser', 'Opérateur de l\'État'].includes(t)) badges.push(`<span class="badge">${esc(t)}</span>`);
    }
    document.getElementById('d-badges').innerHTML = badges.join('');
    const pole = data.poles[a.pole];
    document.getElementById('d-attrs').innerHTML = (pole && pole.id !== node ? `<dt>Pôle</dt><dd>${esc(pole.id)}</dd>` : '') + FIELDS
      .filter(([k]) => a.attrs[k])
      .map(([k, label, kind]) => `<dt>${esc(label)}</dt><dd class="${kind === 'mono' ? 'mono' : ''}">${kind === 'url' ? link(a.attrs[k]) : esc(a.attrs[k])}</dd>`)
      .join('');
    // Voisins groupés par catégorie, dans l'ordre de la légende.
    // Hors arborescence de la bulle (déjà présentée dans « Sous-domaines »).
    const groups = new Map();
    graph.forEachEdge(node, (e, ea, src, tgt) => {
      if (ea.kind === 'bulle') return;
      const n = src === node ? tgt : src, na = graph.getNodeAttributes(n);
      if (!groups.has(na.categorie)) groups.set(na.categorie, []);
      groups.get(na.categorie).push(n);
    });
    const html = data.categories.filter(c => groups.has(c.id)).map(c => {
      const items = groups.get(c.id).sort((x, y) => short(x).localeCompare(short(y), 'fr'));
      return `<h3>${esc(c.label)} · ${items.length}</h3><ul>` + items.map(n =>
        `<li><button type="button" data-node="${esc(n)}"><span class="dot" style="background:${catColor(c.id)}"></span><span class="txt">${esc(short(n))}</span></button></li>`).join('') + '</ul>';
    }).join('');
    document.getElementById('d-links').innerHTML = subsHtml(node) + (html || (graph.getNodeAttribute(node, 'bulle') ? '' : '<h3>Aucun lien</h3>'));
    detail.hidden = false;
    detail.scrollTop = 0;
    const n = [...groups.values()].reduce((t, l) => t + l.length, 0);
    announce.textContent = `${short(node)}, ${cat.label.toLowerCase()}, ${n} lien${n > 1 ? 's' : ''}. Fiche ouverte.`;
    if (focus) document.getElementById('d-title').focus({ preventScroll: true });
    const pos = renderer.getNodeDisplayData(node);
    const zoomTo = graph.getNodeAttribute(node, 'bulle') ? 0.04 : 0.35;
    if (pos) renderer.getCamera().animate({ x: pos.x, y: pos.y, ratio: Math.min(renderer.getCamera().ratio, zoomTo) }, { duration: dur(500) });
  }
  document.getElementById('d-links').addEventListener('click', e => {
    const b = e.target.closest('button[data-node]');
    if (b) select(b.dataset.node);
  });
  document.getElementById('d-close').addEventListener('click', () => select(null));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.selected) select(null); });

  // --- Recherche ---
  const q = document.getElementById('q');
  const results = document.getElementById('results');
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const index = graph.mapNodes((n, a) => [n, norm(n + ' ' + (a.attrs.Organisme || '') + ' ' + (a.attrs['Intitulé 2019'] || ''))]);
  let matches = [];
  q.addEventListener('input', () => {
    const words = norm(q.value.trim()).split(/\s+/).filter(Boolean);
    matches = words.length ? index.filter(([, t]) => words.every(w => t.includes(w))).map(([n]) => n).slice(0, 30) : [];
    results.innerHTML = matches.map(n => {
      const a = graph.getNodeAttributes(n);
      return `<li><button type="button" data-node="${esc(n)}"><span class="dot" style="background:${catColor(a.categorie)}" aria-hidden="true"></span>` +
        `<span class="txt">${esc(short(n))}${a.bulle ? ` <span class="via">bulle ${esc(short(a.bulle))}</span>` : ''}</span></button></li>`;
    }).join('') + (words.length && !matches.length ? '<li class="sub" style="padding:6px 8px">Aucun résultat.</li>' : '');
    document.getElementById('q-count').textContent = words.length
      ? (matches.length ? `${matches.length}${matches.length === 30 ? ' premiers' : ''} résultat${matches.length > 1 ? 's' : ''}, flèche bas pour les parcourir.` : 'Aucun résultat.')
      : '';
  });
  const open = key => select(key);
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && matches[0]) open(matches[0]);
    if (e.key === 'ArrowDown') { e.preventDefault(); results.querySelector('button')?.focus(); }
  });
  results.addEventListener('keydown', e => {
    const items = [...results.querySelectorAll('button')];
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? items[i - 1] : q).focus(); }
  });
  results.addEventListener('click', e => {
    const b = e.target.closest('button[data-node]');
    if (b) open(b.dataset.node);
  });

  // --- Pôles : noms sur la carte et « Aller à » ---
  const polesEl = document.getElementById('poles');
  const poleLabels = data.poles.map(p => {
    const span = document.createElement('span');
    span.textContent = p.label;
    polesEl.appendChild(span);
    return span;
  });
  const bubble = p => {
    const c = renderer.graphToViewport({ x: p.x, y: p.y });
    const e = renderer.graphToViewport({ x: p.x + p.r, y: p.y });
    return { x: c.x, y: c.y, r: Math.abs(e.x - c.x) };
  };
  renderer.on('afterRender', () => {
    polesEl.classList.toggle('dim', !!focus());
    data.poles.forEach((p, i) => {
      const b = bubble(p), el = poleLabels[i];
      // Nom masqué quand la bulle est trop petite ou quand on est très près.
      const show = b.r > 28 && b.r < 900;
      el.hidden = !show;
      if (show) { el.style.left = b.x + 'px'; el.style.top = (b.y - b.r - 4) + 'px'; }
    });
  });
  const poleSelect = document.getElementById('pole');
  data.poles
    .map((p, i) => [p, i])
    .sort(([a], [b]) => a.label.localeCompare(b.label, 'fr'))
    .forEach(([p, i]) => poleSelect.add(new Option(`${p.label} (${fmt(p.size)})`, i)));
  poleSelect.addEventListener('change', () => {
    const p = data.poles[poleSelect.value];
    if (!p) return;
    select(null);
    const cam = renderer.getCamera();
    const b = bubble(p);
    const { width, height } = renderer.getDimensions();
    const target = renderer.viewportToFramedGraph({ x: b.x, y: b.y });
    cam.animate({ x: target.x, y: target.y, ratio: cam.ratio * (b.r * 2.4) / Math.min(width, height) }, { duration: dur(500) });
    announce.textContent = `Carte centrée sur le pôle ${p.label}, ${p.size} éléments.`;
  });
  renderer.refresh();

  // --- Vue liste par pôle (mêmes filtres que la carte) ---
  function renderList() {
    const visible = (n, a) => !state.hidden.has(a.categorie) && (!state.onlyNew || a.nouveau);
    const byPole = data.poles.map(() => new Map());
    let total = 0;
    graph.forEachNode((n, a) => {
      if (!visible(n, a) || a.bulle) return;
      const groups = byPole[a.pole];
      if (!groups.has(a.categorie)) groups.set(a.categorie, []);
      groups.get(a.categorie).push(n);
      total++;
    });
    document.getElementById('list-count').textContent =
      `${fmt(total)} sites et administrations affichés selon les filtres de la légende${state.onlyNew ? ' (ajouts de la V2 seulement)' : ''} ; les sous-domaines sont listés dans la fiche de leur site.`;
    const order = data.poles.map((p, i) => [p, i]).filter(([, i]) => byPole[i].size)
      .sort(([a], [b]) => (a.id === 'Sans ministère identifié') - (b.id === 'Sans ministère identifié') || a.label.localeCompare(b.label, 'fr'));
    // Contenu d'un pôle construit seulement quand on le déplie.
    const inner = groups => data.categories.filter(c => groups.has(c.id)).map(c => {
      const items = groups.get(c.id).sort((x, y) => short(x).localeCompare(short(y), 'fr'));
      return `<h3>${esc(c.label)} · ${fmt(items.length)}</h3><ul>` + items.map(n => {
        const subs = membersOf.get(n)?.length;
        return `<li><button type="button" data-node="${esc(n)}"><span class="dot" style="background:${catColor(c.id)}" aria-hidden="true"></span>` +
          `<span class="txt">${esc(short(n))}${subs ? ` <span class="via">+${fmt(subs)} sous-domaines</span>` : ''}</span>` +
          `${graph.getNodeAttribute(n, 'nouveau') ? '<span class="new">Ajout V2</span>' : ''}</button></li>`;
      }).join('') + '</ul>';
    }).join('');
    const body = document.getElementById('list-body');
    body.innerHTML = order.map(([p, i]) => {
      const count = [...byPole[i].values()].reduce((s, l) => s + l.length, 0);
      return `<details data-pole="${i}"><summary><span>${esc(p.id === 'Sans ministère identifié' ? p.id : p.label)}</span><span class="count">${fmt(count)}</span></summary></details>`;
    }).join('');
    body.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => {
      if (d.open && !d.dataset.filled) { d.insertAdjacentHTML('beforeend', inner(byPole[d.dataset.pole])); d.dataset.filled = '1'; }
    }));
  }
  const listEl = document.getElementById('list');
  const vMap = document.getElementById('v-map'), vList = document.getElementById('v-list');
  function showList(on) {
    listEl.hidden = !on;
    document.body.classList.toggle('list-mode', on);
    vMap.setAttribute('aria-pressed', String(!on));
    vList.setAttribute('aria-pressed', String(on));
    if (on) { renderList(); document.getElementById('list-title').focus(); }
    else vList.focus();
  }
  vList.addEventListener('click', () => showList(true));
  vMap.addEventListener('click', () => showList(false));
  document.getElementById('list-back').addEventListener('click', () => showList(false));
  document.getElementById('list-body').addEventListener('click', e => {
    const b = e.target.closest('button[data-node]');
    if (b) select(b.dataset.node);
  });

  // --- Zoom ---
  const cam = renderer.getCamera();
  document.getElementById('z-in').addEventListener('click', () => cam.animatedZoom({ duration: dur(250) }));
  document.getElementById('z-out').addEventListener('click', () => cam.animatedUnzoom({ duration: dur(250) }));
  document.getElementById('z-reset').addEventListener('click', () => cam.animatedReset({ duration: dur(350) }));

  // Lien direct vers un élément : #domaine (ex. #ademe.fr).
  const target = decodeURIComponent(location.hash.slice(1));
  if (target) {
    const hit = graph.findNode(n => short(n) === target || n === target);
    if (hit) select(hit);
  }
})();
</script>
